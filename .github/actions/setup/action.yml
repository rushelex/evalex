name: Set up project
description: Installs pnpm, Node.js and dependencies from the lockfile

runs:
  using: composite
  steps:
    # Reads the pnpm version from devEngines.packageManager in package.json
    - name: Set up pnpm
      uses: pnpm/action-setup@v6

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
